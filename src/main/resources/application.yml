# 기본 설정 (모든 프로파일에서 공통으로 사용)
server:
    port: ${SERVER_PORT:8080}

spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travodo_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:1234}
        hikari:
            maximum-pool-size: 5
            minimum-idle: 2
            connection-timeout: 30000

    jpa:
        hibernate:
            ddl-auto: ${DDL_AUTO:create} # 개발 환경: create, 프로덕션: validate 또는 none
        database-platform: org.hibernate.dialect.MySQLDialect
        properties:
            hibernate:
                format_sql: false
        show-sql: false
        open-in-view: false

      # localDate Jackson설정
        jackson:
            date-format: yyyy-MM-dd
            time-zone: Asia/Seoul

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME:gdgoctravodo@gmail.com}
        password: ${MAIL_PASSWORD:kvvtwqrtbeedjtaj}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        url: /v3/api-docs
        display-request-duration: true
        groups-order: ASC

jwt:
    secret: ${JWT_SECRET:your-secret-key-change-this-in-production-use-long-random-string}
    expiration: 86400000

# AWS S3 기본 설정
aws:
    s3:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}
        base-url: ${AWS_S3_BASE_URL:}
